plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Hibernate (puedes mantener esta versión si no necesitas compatibilidad con Jakarta EE)
    implementation 'org.hibernate:hibernate-core:5.6.10.Final'
    implementation 'org.hibernate:hibernate-envers:5.6.10.Final'
    implementation 'org.hibernate:hibernate-entitymanager:5.6.10.Final'

    // Lombok (actualizado para soporte de JDK 21)
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'

    // Base de datos MySQL
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'

    // JUnit 5 (opcionalmente actualizado)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
}


